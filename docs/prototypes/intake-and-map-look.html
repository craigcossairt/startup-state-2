<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PROTOTYPE — Intake and Opportunity Map look</title>
  <!--
    Three variants of Intake + Opportunity Map, switchable via ?variant=A|B|C.
    Single HTML because the app is not scaffolded. THROW AWAY. Not the product.
    Brand tokens from Part 1 Startup State. No Playbook, no geo map, no "eligible".
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@700;800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:ital,wght@0,400;1,500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --midnight: #0A192E;
      --onyx: #414042;
      --green: #00A24C;
      --green-hover: #008B40;
      --bright: #13DF81;
      --soft: #A3F0AE;
      --off: #F6F7F8;
      --alt: #F2F3F4;
      --rule: #E4E5E7;
      --muted: #6B6C70;
      --white: #fff;
      --yellow: #FFAD00;
      --orange: #FF6840;
      --shadow: 0 4px 12px rgba(10,25,46,.08), 0 2px 4px rgba(10,25,46,.06);
      --display: Mulish, "Helvetica Neue", Arial, sans-serif;
      --sans: "Source Sans 3", "Helvetica Neue", Arial, sans-serif;
      --serif: "Source Serif 4", Georgia, serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--off); color: var(--onyx); font-family: var(--sans); }
    button, input, textarea { font: inherit; }
    a { color: var(--green); }
    .eyebrow { font-family: var(--display); font-weight: 700; letter-spacing: .18em; text-transform: uppercase; font-size: 11px; color: var(--muted); }
    .display { font-family: var(--display); font-weight: 800; letter-spacing: -.02em; line-height: 1.05; }
    .serif { font-family: var(--serif); font-style: italic; }

    .proto-flag {
      background: #FFAD00; color: var(--midnight); text-align: center;
      font-size: 12px; font-weight: 700; padding: 6px 12px; letter-spacing: .04em;
    }

    .nav {
      position: sticky; top: 0; z-index: 20;
      background: rgba(255,255,255,.9); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--rule);
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 20px; gap: 16px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .wordmark { font-family: var(--display); font-weight: 800; color: var(--midnight); font-size: 18px; letter-spacing: -.02em; }
    .goeo { border-left: 1px solid var(--rule); padding-left: 12px; font-size: 11px; color: var(--muted); line-height: 1.2; max-width: 140px; }
    .nav-links { display: flex; gap: 4px; font-size: 14px; font-weight: 600; }
    .nav-links span { padding: 6px 10px; border-radius: 6px; color: var(--midnight); background: var(--alt); }

    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      border-radius: 999px; padding: 4px 10px; font-size: 11px; font-weight: 700;
      border: 1px solid var(--rule); background: var(--white);
    }
    .pill.federal { background: var(--midnight); color: #fff; border-color: var(--midnight); }
    .pill.utah { background: var(--soft); color: var(--midnight); border-color: transparent; }
    .pill.likely { background: var(--green); color: #fff; border-color: var(--green); }
    .pill.verify { background: #fff6d6; color: #7a5200; border-color: #f0d070; }
    .pill.adjacent { background: var(--alt); color: var(--onyx); }
    .pill.no { background: var(--white); color: var(--muted); border-style: dashed; }

    .chip {
      border: 1px solid var(--rule); background: var(--white); border-radius: 999px;
      padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--onyx);
    }
    .chip[aria-pressed="true"] { border-color: var(--green); background: #e9f8ee; color: var(--midnight); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }

    .btn {
      background: var(--green); color: #fff; border: 0; border-radius: 8px;
      padding: 10px 16px; font-weight: 700; cursor: pointer;
    }
    .btn:hover { background: var(--green-hover); }
    .btn.ghost { background: transparent; color: var(--midnight); border: 1px solid var(--rule); }

    .fixture {
      border: 1px solid var(--rule); background: var(--white); border-radius: 10px;
      padding: 10px 12px; text-align: left; cursor: pointer; font-weight: 600; font-size: 13px;
    }
    .fixture:hover, .fixture[aria-pressed="true"] { border-color: var(--green); box-shadow: var(--shadow); }
    .fixture small { display: block; font-weight: 400; color: var(--muted); margin-top: 2px; }

    .banner {
      background: var(--midnight); color: #fff; border-radius: 12px; padding: 16px 18px;
    }
    .banner p { margin: 6px 0 0; font-family: var(--serif); font-style: italic; color: #d7dde6; }

    .card {
      background: var(--white); border: 1px solid var(--rule); border-radius: 12px;
      padding: 16px; box-shadow: 0 1px 2px rgba(10,25,46,.04);
    }
    .card h3 { margin: 0 0 6px; font-family: var(--display); font-size: 18px; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; color: var(--muted); font-size: 13px; margin: 8px 0; }
    .why { margin: 10px 0 0; }
    .concerns { margin: 8px 0 0; padding-left: 18px; color: var(--muted); font-size: 14px; }
    .history { margin: 12px 0 0; padding: 10px 12px; background: var(--off); border-radius: 8px; font-size: 13px; }
    .next { margin-top: 12px; font-weight: 700; }

    .switcher {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      z-index: 50; display: flex; align-items: center; gap: 10px;
      background: var(--midnight); color: #fff; border-radius: 999px;
      padding: 8px 10px; box-shadow: 0 8px 24px rgba(10,25,46,.28);
      font-size: 13px; font-weight: 700;
    }
    .switcher button {
      background: #fff; color: var(--midnight); border: 0; width: 32px; height: 32px;
      border-radius: 999px; cursor: pointer; font-weight: 800;
    }
    .state-dock {
      position: fixed; right: 12px; bottom: 72px; z-index: 40; width: 280px;
      background: #fff; border: 1px dashed #FFAD00; border-radius: 10px; padding: 10px 12px;
      font-size: 12px; box-shadow: var(--shadow);
    }
    .state-dock pre { margin: 6px 0 0; white-space: pre-wrap; color: var(--muted); }

    /* A — editorial stack */
    .a-hero { background: var(--midnight); color: #fff; padding: 56px 24px 40px; }
    .a-hero .wrap, .wrap { max-width: 860px; margin: 0 auto; }
    .a-hero h1 { font-size: clamp(32px, 5vw, 52px); margin: 8px 0 12px; }
    .a-hero textarea, .composer {
      width: 100%; min-height: 88px; border-radius: 10px; border: 0;
      padding: 14px; resize: vertical;
    }
    .a-body { max-width: 860px; margin: 0 auto; padding: 24px 20px 120px; }
    .fixture-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; margin: 16px 0; }

    /* B — split workspace */
    .b-shell { display: grid; grid-template-columns: 320px 1fr; min-height: calc(100vh - 96px); }
    .b-rail { background: var(--white); border-right: 1px solid var(--rule); padding: 20px; }
    .b-main { padding: 20px 24px 120px; }
    .row-card { display: grid; grid-template-columns: 110px 1fr auto; gap: 12px; align-items: start; }
    @media (max-width: 860px) {
      .b-shell { grid-template-columns: 1fr; }
      .row-card { grid-template-columns: 1fr; }
    }

    /* C — one-card focus */
    .c-composer { background: var(--white); border-bottom: 1px solid var(--rule); padding: 16px 20px; }
    .c-shell { display: grid; grid-template-columns: 280px 1fr; min-height: calc(100vh - 180px); }
    .c-strip { border-right: 1px solid var(--rule); background: var(--white); overflow: auto; }
    .strip-item { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--rule); background: transparent; padding: 12px 14px; cursor: pointer; }
    .strip-item[aria-current="true"] { background: #e9f8ee; box-shadow: inset 3px 0 0 var(--green); }
    .c-focus { padding: 24px 28px 120px; }
    .focus-card { max-width: 720px; padding: 28px; }
    @media (max-width: 860px) { .c-shell { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="proto-flag">PROTOTYPE — throwaway. Not the app. Arrow keys switch layout variants.</div>
  <header class="nav">
    <div class="brand">
      <div class="wordmark">Startup State</div>
      <div class="goeo">Governor's Office of Economic Opportunity</div>
    </div>
    <div class="nav-links"><span>Opportunity Map</span></div>
  </header>
  <main id="app"></main>
  <aside class="state-dock">
    <strong>Prototype state</strong>
    <pre id="stateOut"></pre>
  </aside>
  <div class="switcher" role="group" aria-label="Layout variant">
    <button type="button" id="prevV" aria-label="Previous variant">←</button>
    <span id="vLabel">A — Editorial stack</span>
    <button type="button" id="nextV" aria-label="Next variant">→</button>
  </div>

<script>
const VARIANTS = [
  { key: "A", name: "Editorial stack" },
  { key: "B", name: "Split workspace" },
  { key: "C", name: "One-card focus" },
];
const FIT_CLASS = {
  likely: "likely",
  "potential-verify": "verify",
  adjacent: "adjacent",
  "probably not": "no",
};
const FIXTURES = [
  { id: "fixture-1", label: "Healthcare AI", hint: "15 people, SLC" },
  { id: "fixture-2", label: "Aerospace", hint: "35 people, Ogden" },
  { id: "fixture-3", label: "Water / climate", hint: "10 people, Provo" },
  { id: "fixture-4", label: "Cyber", hint: "22 people, Lehi" },
  { id: "fixture-5", label: "Youth marketplace (honest-no)", hint: "8 people, SLC" },
];
const CHIPS = [
  { id: "lane-federal", label: "Federal" },
  { id: "lane-utah", label: "Utah" },
  { id: "sbir-help", label: "SBIR help" },
  { id: "contracting", label: "Contracting" },
  { id: "state-capital", label: "State capital" },
  { id: "workforce", label: "Workforce" },
  { id: "counseling", label: "Counseling" },
  { id: "trade", label: "Trade" },
  { id: "directory", label: "Directory" },
  { id: "fit-likely", label: "Fit: likely" },
  { id: "fit-verify", label: "Fit: potential-verify" },
];

const CARDS = {
  "fixture-1": [
    { program: "NIH SBIR / STTR Parent (PA-27-100)", agency: "HHS / NIH", instrument: "grant", lane: "federal", fit: "likely", value: null, deadline: "2027-04-05", why: "AI that cuts nurse admin work maps to NIH health-IT and SBIR small-business research.", concerns: ["Confirm a clinical study partner before you write."], next: "Read the current NIH SBIR parent announcement", awardees: [{ name: "Recursion Pharmaceuticals", place: "Salt Lake City, UT", amount: "$1.8M", year: "2023" }] },
    { program: "NSF Seed Fund (America's Seed Fund)", agency: "NSF", instrument: "grant", lane: "federal", fit: "potential-verify", value: { min: 275000, max: 2000000 }, deadline: "2026-12-03", why: "Deep tech plus product development matches Seed Fund, if the R&D is novel enough.", concerns: ["NSF wants technical risk, not only hospital sales."], next: "Check the next Seed Fund window", awardees: [{ name: "Narrativa", place: "Provo, UT", amount: "$275K", year: "2024" }] },
    { program: "HHS ONC Leading Edge Acceleration Projects", agency: "HHS", instrument: "grant", lane: "federal", fit: "adjacent", value: null, deadline: "2026-09-18", why: "Health IT, but often wants health systems as the applicant.", concerns: ["You may need a hospital prime."], next: "Verify who can apply", awardees: [] },
    { program: "Nucleus Grow", agency: "Nucleus (Utah)", instrument: "counseling", lane: "state", fit: "likely", value: null, deadline: null, why: "Utah SBIR help desk for a core R&D company.", concerns: [], next: "Book a Nucleus intake", awardees: [] },
    { program: "USBCI Capital Access Program", agency: "GOEO / USBCI", instrument: "loan", lane: "state", fit: "adjacent", value: { min: 50000, max: 500000 }, deadline: null, why: "Utah credit if the grant path is slow.", concerns: ["Loan, not a grant."], next: "Talk to a listed USBCI lender", awardees: [] },
    { program: "APEX Accelerator", agency: "GOEO / APEX", instrument: "contracting_help", lane: "state", fit: "adjacent", value: null, deadline: null, why: "Hospital pilots can sit next to federal procurement later.", concerns: ["Not a grant."], next: "County APEX signup", awardees: [] },
  ],
  "fixture-5": [
    { program: "Utah SBDC advising", agency: "Utah SBDC", instrument: "counseling", lane: "state", fit: "likely", value: null, deadline: null, why: "Early-revenue marketplace with no R&D story. Advising is the honest first step.", concerns: [], next: "Book an SBDC session", awardees: [] },
    { program: "Talent Ready / Custom Fit", agency: "DWS", instrument: "grant", lane: "state", fit: "potential-verify", value: null, deadline: null, why: "Hiring to expand a youth marketplace can fit workforce training, not a science grant.", concerns: ["Often needs a training partner."], next: "Ask DWS about Custom Fit", awardees: [] },
    { program: "USBCI Loan Participation", agency: "GOEO / USBCI", instrument: "loan", lane: "state", fit: "adjacent", value: { min: 25000, max: 250000 }, deadline: null, why: "Expansion capital exists on the State lane if you want debt.", concerns: ["Utah small-business loan rules."], next: "USBCI lender list", awardees: [] },
    { program: "NSF Seed Fund", agency: "NSF", instrument: "grant", lane: "federal", fit: "probably not", value: { min: 275000, max: 2000000 }, deadline: "2026-12-03", why: "A parent/youth marketplace is not a technical-risk R&D project.", concerns: ["Do not force an SBIR narrative onto this company."], next: "Skip unless the product becomes research", awardees: [] },
    { program: "NIH SBIR / STTR Parent", agency: "HHS / NIH", instrument: "grant", lane: "federal", fit: "probably not", value: null, deadline: "2027-04-05", why: "No biomedical or clinical research in the company.", concerns: ["Wrong agency mission."], next: "Do not apply", awardees: [] },
  ],
};
CARDS["fixture-2"] = CARDS["fixture-1"];
CARDS["fixture-3"] = CARDS["fixture-1"];
CARDS["fixture-4"] = CARDS["fixture-1"];

const state = {
  variant: new URLSearchParams(location.search).get("variant") || "A",
  step: "intake",
  fixture: null,
  sentence: "",
  chips: {},
  focus: 0,
};

function money(v) {
  if (!v) return "Not published";
  const f = (n) => "$" + (n >= 1000000 ? (n / 1000000).toFixed(1) + "M" : Math.round(n / 1000) + "K");
  return v.min === v.max ? f(v.min) : f(v.min) + " – " + f(v.max);
}
function date(d) { return d ? new Date(d + "T00:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) : "Standing / no close date"; }
function fitLabel(f) { return f; }
function cards() { return CARDS[state.fixture] || []; }
function floorTripped() { return state.fixture === "fixture-5"; }

function setVariant(key) {
  state.variant = key;
  const u = new URL(location.href);
  u.searchParams.set("variant", key);
  history.replaceState({}, "", u);
  render();
}
function cycle(dir) {
  const i = VARIANTS.findIndex((v) => v.key === state.variant);
  const n = VARIANTS[(i + dir + VARIANTS.length) % VARIANTS.length];
  setVariant(n.key);
}

function fixturesHtml() {
  return `<div class="fixture-grid">${FIXTURES.map((f) =>
    `<button class="fixture" data-fix="${f.id}" aria-pressed="${state.fixture === f.id}">${f.label}<small>${f.hint}</small></button>`
  ).join("")}</div>`;
}
function chipsHtml() {
  return `<div class="chip-row">${CHIPS.map((c) =>
    `<button class="chip" data-chip="${c.id}" aria-pressed="${!!state.chips[c.id]}">${c.label}</button>`
  ).join("")}</div>`;
}
function badge(card) {
  const lane = card.lane === "federal" ? "Federal" : "Utah";
  return `<span class="pill ${card.lane}">${lane}</span><span class="pill ${FIT_CLASS[card.fit]}">${fitLabel(card.fit)}</span><span class="pill">${card.instrument.replace("_", " ")}</span>`;
}
function historyHtml(card) {
  if (!card.awardees.length) return `<div class="history">No similar awardees attached for this stub.</div>`;
  return `<div class="history"><div class="eyebrow">Similar awardees</div>${card.awardees.map((a) =>
    `<div>${a.name} · ${a.place} · ${a.amount} · ${a.year}</div>`
  ).join("")}</div>`;
}
function cardHtml(card, compact) {
  return `<article class="card ${compact ? "row-card" : ""}">
    <div>${badge(card)}</div>
    <div>
      <h3>${card.program}</h3>
      <div class="meta"><span>${card.agency}</span><span>${money(card.value)}</span><span>${date(card.deadline)}</span></div>
      ${compact ? "" : `<p class="why"><strong>Why this.</strong> ${card.why}</p>
      ${card.concerns.length ? `<ul class="concerns">${card.concerns.map((c) => `<li>${c}</li>`).join("")}</ul>` : ""}
      ${historyHtml(card)}
      <div class="next">${card.next}</div>`}
    </div>
    ${compact ? `<div class="next">${card.next}</div>` : ""}
  </article>`;
}
function bannerHtml() {
  if (!floorTripped()) return "";
  return `<div class="banner"><div class="eyebrow" style="color:#A3F0AE">Probably-not floor</div>
    <p>Traditional federal grants look like a poor fit for this company. Utah programs below are the stronger place to start.</p></div>`;
}
function intakeCopy() {
  return {
    eyebrow: "Government Opportunity Finder",
    title: "Tell us about your company",
    sub: "One sentence is enough. Or click a fixture. We infer, confirm, then show a ranked Opportunity Map. Fit, never eligible.",
  };
}

function renderIntakeA() {
  const t = intakeCopy();
  return `<section class="a-hero">
    <div class="wrap">
      <div class="eyebrow" style="color:#A3F0AE">${t.eyebrow}</div>
      <h1 class="display">${t.title}</h1>
      <p class="serif" style="color:#d7dde6;max-width:38rem">${t.sub}</p>
      <textarea id="sentence" placeholder="We build AI that cuts paperwork for hospital nurses in Utah…">${state.sentence}</textarea>
      <div style="margin-top:12px"><button class="btn" id="goSentence">See the map</button></div>
    </div>
  </section>
  <section class="a-body">
    <div class="eyebrow">Official fixtures</div>
    ${fixturesHtml()}
  </section>`;
}
function renderMapA() {
  return `<section class="a-body">
    ${bannerHtml()}
    <div style="margin:18px 0 8px" class="eyebrow">Widen retrieve</div>
    ${chipsHtml()}
    <div style="display:flex;flex-direction:column;gap:12px;margin-top:18px">${cards().map((c) => cardHtml(c)).join("")}</div>
  </section>`;
}
function renderConfirm() {
  return `<section class="a-body">
    <div class="eyebrow">Confirm what we inferred</div>
    <h2 class="display">Does this look right?</h2>
    <p class="serif">Must-haves we filled from your sentence. Edit, then continue. Fixtures skip this step.</p>
    <div class="card">
      <p><strong>What they do.</strong> ${state.sentence || "AI that reduces nurse paperwork"}</p>
      <p><strong>HQ.</strong> United States, Utah</p>
      <p><strong>Need.</strong> $500K – $2M for product and pilots</p>
    </div>
    <p><button class="btn" id="confirmGo">Continue to the map</button></p>
  </section>`;
}

function renderB() {
  const t = intakeCopy();
  const map = state.step === "map";
  return `<div class="b-shell">
    <aside class="b-rail">
      <div class="eyebrow">${t.eyebrow}</div>
      <h2 class="display" style="font-size:28px;margin:8px 0">${t.title}</h2>
      <textarea class="composer" id="sentence" placeholder="One sentence…">${state.sentence}</textarea>
      <p><button class="btn" id="goSentence">Infer</button></p>
      <div class="eyebrow">Fixtures</div>
      ${fixturesHtml()}
      ${map ? `<hr style="border:0;border-top:1px solid var(--rule);margin:16px 0" />
        <p class="serif">${FIXTURES.find((f) => f.id === state.fixture)?.label || ""}</p>` : ""}
    </aside>
    <section class="b-main">
      ${!map ? `<p class="serif" style="color:var(--muted)">The map appears here after a fixture or confirm. Same Ranked cards, denser rows.</p>` : `
        ${bannerHtml()}
        <div style="margin:16px 0">${chipsHtml()}</div>
        <div style="display:flex;flex-direction:column;gap:10px">${cards().map((c) => cardHtml(c, true)).join("")}</div>`}
    </section>
  </div>`;
}

function renderC() {
  const t = intakeCopy();
  const list = cards();
  const current = list[state.focus] || list[0];
  return `<div class="c-composer">
    <div class="eyebrow">${t.eyebrow}</div>
    <div style="display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap">
      <textarea class="composer" id="sentence" style="flex:1;min-width:240px;min-height:56px" placeholder="One sentence…">${state.sentence}</textarea>
      <button class="btn" id="goSentence">See map</button>
    </div>
    ${fixturesHtml()}
  </div>
  ${state.step !== "map" ? `<p class="wrap serif" style="padding:24px;color:var(--muted)">Pick a fixture or send a sentence. Then one Ranked card fills the page.</p>` : `
  <div class="c-shell">
    <nav class="c-strip">${list.map((c, i) =>
      `<button class="strip-item" data-focus="${i}" aria-current="${i === state.focus}">
        <div>${badge(c)}</div>
        <strong>${c.program}</strong>
      </button>`
    ).join("")}</nav>
    <section class="c-focus">
      ${bannerHtml()}
      <div style="margin:16px 0">${chipsHtml()}</div>
      ${current ? cardHtml(current) : ""}
    </section>
  </div>`}`;
}

function render() {
  if (!VARIANTS.some((v) => v.key === state.variant)) state.variant = "A";
  const v = VARIANTS.find((x) => x.key === state.variant);
  document.getElementById("vLabel").textContent = v.key + " — " + v.name;
  const root = document.getElementById("app");
  if (state.step === "confirm") root.innerHTML = renderConfirm();
  else if (state.variant === "B") root.innerHTML = renderB();
  else if (state.variant === "C") root.innerHTML = renderC();
  else root.innerHTML = state.step === "map" ? renderMapA() : renderIntakeA();

  document.getElementById("stateOut").textContent = JSON.stringify({
    variant: state.variant,
    step: state.step,
    fixture: state.fixture,
    cards: cards().length,
    floor: floorTripped(),
    focus: state.focus,
    chipsOn: Object.keys(state.chips).filter((k) => state.chips[k]),
  }, null, 2);

  bind();
}

function bind() {
  document.getElementById("goSentence")?.addEventListener("click", () => {
    state.sentence = document.getElementById("sentence")?.value || "";
    state.fixture = state.fixture || "fixture-1";
    state.step = "confirm";
    state.focus = 0;
    render();
  });
  document.getElementById("confirmGo")?.addEventListener("click", () => {
    state.step = "map";
    render();
  });
  document.querySelectorAll("[data-fix]").forEach((el) => {
    el.addEventListener("click", () => {
      state.fixture = el.getAttribute("data-fix");
      state.step = "map";
      state.focus = 0;
      render();
    });
  });
  document.querySelectorAll("[data-chip]").forEach((el) => {
    el.addEventListener("click", () => {
      const id = el.getAttribute("data-chip");
      state.chips[id] = !state.chips[id];
      render();
    });
  });
  document.querySelectorAll("[data-focus]").forEach((el) => {
    el.addEventListener("click", () => {
      state.focus = Number(el.getAttribute("data-focus"));
      render();
    });
  });
}

document.getElementById("prevV").onclick = () => cycle(-1);
document.getElementById("nextV").onclick = () => cycle(1);
document.addEventListener("keydown", (e) => {
  const tag = document.activeElement?.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || document.activeElement?.isContentEditable) return;
  if (e.key === "ArrowLeft") cycle(-1);
  if (e.key === "ArrowRight") cycle(1);
});

render();
</script>
</body>
</html>
