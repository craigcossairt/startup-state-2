<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" preserveAspectRatio="xMidYMid slice">
  <!-- Large Gradient brand pattern: oversized mark glyphs at descending opacity (50/35/25%) -->
  <defs>
    <symbol id="ssbig" viewBox="0 0 24 24">
      <path d="M2 4 L22 4 L20 8 L13 8 L12 9 L5 9 Z" fill="currentColor" />
      <path d="M5.5 11 L18.5 11 L16.5 15 L12.5 15 L11.5 16 L7.5 16 Z" fill="currentColor" />
      <path d="M9 18 L15 18 L12 24 Z" fill="currentColor" />
    </symbol>
  </defs>
  <g color="#0A192E">
    <use href="#ssbig" x="-150" y="-150" width="700" height="700" opacity="0.5"/>
    <use href="#ssbig" x="200"  y="50"   width="600" height="600" opacity="0.35"/>
    <use href="#ssbig" x="450"  y="250"  width="500" height="500" opacity="0.25"/>
  </g>
</svg>
